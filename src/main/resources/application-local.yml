spring:
  datasource:
    url: jdbc:mysql://localhost:3306/books_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
    username: books_user
    password: books_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 15
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50000
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        generate_statistics: false
  sql:
    init:
      mode: always
      continue-on-error: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    oauth:
      clientId: books-service
      usePkceWithAuthorizationCodeGrant: true
    operations-sorter: method
    tags-sorter: alpha
    syntaxHighlight:
      activated: true
      theme: monokai
  api-docs:
    path: /v3/api-docs
    enabled: true

server:
  port: 9090
  # Connection timeout for large uploads
  tomcat:
    connection-timeout: 600000
    max-connections: 200
    threads:
      max: 200
      min-spare: 10
    # Tomcat POST size limit (must match multipart limits)
    max-http-form-post-size: 209715200  # 200MB in bytes

# Local Development Settings
logging:
  level:
    root: INFO
    com.example.untitled: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Application Info
app:
  name: Books API
  version: 1.0.0
  environment: local
  description: Local development environment on port 9090
