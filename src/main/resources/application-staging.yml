spring:
  datasource:
    url: jdbc:mysql://staging-db-server:3306/books_db?useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC&rewriteBatchedStatements=true
    username: ${DB_USER:books_user}
    password: ${DB_PASSWORD:books_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50000
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        generate_statistics: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

server:
  port: 8080
  tomcat:
    connection-timeout: 600000
    max-connections: 100
    threads:
      max: 100
      min-spare: 5
    # Tomcat POST size limit (must match multipart limits)
    max-http-form-post-size: 209715200  # 200MB in bytes

logging:
  level:
    root: WARN
    com.example.untitled: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  name: Books API
  version: 1.0.0
  environment: staging
  description: Staging environment
